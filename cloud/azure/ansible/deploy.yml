---
- name: Desplegar Entorno LastFM Collector en Azure
  hosts: debian12
  become: true
  tasks:
    - name: Instalar Git y dependencias de Docker
      apt:
        name: [git, apt-transport-https, ca-certificates, curl, gnupg]
        state: present
        update_cache: yes

    - name: Añadir clave GPG y repositorio de Docker
      shell: |
        curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg --yes
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/debian $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list

    - name: Instalar Docker y Compose
      apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
        update_cache: yes

    - name: Clonar la rama 'main' del repositorio
      git:
        repo: 'https://github.com/beetlebum97/LastFMCollector.git'
        dest: /opt/LastFMCollector
        version: main
        force: yes

    - name: Levantar la Infraestructura Docker (PostgreSQL + FastAPI)
      command: docker compose -f docker-compose.prod.yml up -d
      args:
        chdir: /opt/LastFMCollector/cloud/azure
