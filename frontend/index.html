<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last.fm | Curated Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ── TOKENS ─────────────────────────────────────── */
        :root {
            /* RED MODE */
            --bg:           #D51007;
            --bg2:          rgba(0,0,0,0.22);
            --bg3:          rgba(0,0,0,0.15);
            --card-bg:      rgba(255,255,255,0.11);
            --card-border:  rgba(255,255,255,0.18);
            --card-hover:   rgba(255,255,255,0.18);
            --nav-bg:       rgba(0,0,0,0.28);
            --nav-border:   rgba(0,0,0,0.18);
            --filter-bg:    rgba(0,0,0,0.18);
            --text-1:       #ffffff;
            --text-2:       #ffffff;
            --text-3:       rgba(255,255,255,0.60);
            --text-rank:    #ff9b96;
            --pill-bg:      rgba(0,0,0,0.30);
            --pill-text:    #fff;
            --divider:      rgba(255,255,255,0.13);
            --bar-bg:       rgba(255,255,255,0.20);
            --bar-fill:     #fff;
            --input-bg:     rgba(0,0,0,0.22);
            --input-border: rgba(255,255,255,0.22);
            --input-focus:  rgba(255,255,255,0.70);
            --btn-bg:       rgba(0,0,0,0.32);
            --btn-hover:    rgba(0,0,0,0.48);
            --pag-bg:       rgba(0,0,0,0.22);
            --stat-top:     rgba(255,255,255,0.55);
            --scrobble-bar: #ff9b96;
            --date-color:   #ff9b96;
            --toggle-icon:  "🌙";
        }
        html.dark {
            /* DARK MODE */
            --bg:           #111111;
            --bg2:          #1a1a1a;
            --bg3:          #161616;
            --card-bg:      #1a1a1a;
            --card-border:  #2a2a2a;
            --card-hover:   #222;
            --nav-bg:       #1a1a1a;
            --nav-border:   #2a2a2a;
            --filter-bg:    #161616;
            --text-1:       #ffffff;
            --text-2:       #d1d5db;
            --text-3:       #9ca3af;
            --text-rank:    #D51007;
            --pill-bg:      rgba(213,16,7,0.18);
            --pill-text:    #ff6b63;
            --divider:      #2a2a2a;
            --bar-bg:       #2a2a2a;
            --bar-fill:     #D51007;
            --input-bg:     #2a2a2a;
            --input-border: #3a3a3a;
            --input-focus:  #D51007;
            --btn-bg:       #D51007;
            --btn-hover:    #b00e06;
            --pag-bg:       #2a2a2a;
            --stat-top:     #D51007;
            --scrobble-bar: #D51007;
            --date-color:   #D51007;
            --toggle-icon:  "☀️";
        }

        /* ── BASE ────────────────────────────────────────── */
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text-1); font-family: ui-sans-serif, system-ui, sans-serif; min-height: 100vh; transition: background 0.3s; }

        ::-webkit-scrollbar { width: 7px; }
        ::-webkit-scrollbar-track { background: var(--bg2); }
        ::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

        /* ── NAV ─────────────────────────────────────────── */
        .nav-bar { background: var(--nav-bg); border-bottom: 1px solid var(--nav-border); padding: 10px 0; }

        /* ── FILTER BAR ──────────────────────────────────── */
        .filter-strip { background: var(--filter-bg); border-bottom: 1px solid var(--nav-border); padding: 8px 0; }

        /* ── INPUTS / BUTTONS ────────────────────────────── */
        .s-input {
            background: var(--input-bg); color: var(--text-1);
            border: 1px solid var(--input-border); border-radius: 6px;
            padding: 7px 14px; font-size: 0.85rem; transition: border 0.15s, box-shadow 0.15s;
        }
        .s-input::placeholder { color: var(--text-3); }
        .s-input:focus { outline: none; border-color: var(--input-focus); box-shadow: 0 0 0 2px color-mix(in srgb, var(--input-focus) 25%, transparent); }

        .s-btn {
            background: var(--btn-bg); color: var(--text-1);
            border: 1px solid var(--input-border); border-radius: 6px;
            padding: 7px 18px; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: background 0.15s;
        }
        .s-btn:hover { background: var(--btn-hover); }

        /* ── TOGGLE ──────────────────────────────────────── */
        .toggle-btn {
            background: var(--pag-bg); color: var(--text-1);
            border: 1px solid var(--input-border); border-radius: 20px;
            padding: 5px 13px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 6px; transition: background 0.15s; white-space: nowrap;
        }
        .toggle-btn:hover { background: var(--btn-hover); }

        /* ── CARDS ───────────────────────────────────────── */
        .glass { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; }
        .stat-card { border-top: 3px solid var(--stat-top); }

        /* ── COLUMN TITLES ───────────────────────────────── */
        .col-title {
            color: var(--text-1); font-weight: 800; font-size: 0.78rem;
            letter-spacing: 0.09em; text-transform: uppercase;
            border-bottom: 1px solid var(--divider); padding-bottom: 10px; margin-bottom: 12px;
        }

        /* ── LIST ROWS ───────────────────────────────────── */
        .row-item { padding: 6px 5px; border-radius: 5px; border-bottom: 1px solid var(--divider); transition: background 0.12s; cursor: default; }
        .row-item:last-child { border-bottom: none; }
        .row-item:hover { background: var(--card-hover); }

        /* ── TEXT ROLES ──────────────────────────────────── */
        .t1 { color: var(--text-1); font-size: 0.84rem; font-weight: 600; }
        .t2 { color: var(--text-2); font-size: 0.75rem; font-weight: 500; }
        .t3 { color: var(--text-3); font-size: 0.72rem; }
        .rank { color: var(--text-rank); font-size: 0.68rem; font-weight: 700; margin-right: 3px; }

        /* ── PILL (playcount) ────────────────────────────── */
        .pill { background: var(--pill-bg); color: var(--pill-text); font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }

        /* ── PROGRESS BAR ────────────────────────────────── */
        .bar-bg { background: var(--bar-bg); border-radius: 2px; height: 3px; margin-top: 5px; }
        .bar-fill { background: var(--bar-fill); border-radius: 2px; height: 3px; transition: width 0.35s ease; }

        /* ── SCROBBLE ────────────────────────────────────── */
        .scrobble-line { border-left: 2px solid var(--scrobble-bar); padding-left: 10px; }
        .date-badge { color: var(--date-color); font-size: 0.7rem; white-space: nowrap; flex-shrink: 0; }

        /* ── PAGINATION ──────────────────────────────────── */
        .pag-btn { background: var(--pag-bg); color: var(--text-1); border: 1px solid var(--divider); border-radius: 5px; padding: 3px 11px; font-size: 0.75rem; font-weight: 800; cursor: pointer; transition: background 0.12s; }
        .pag-btn:hover:not([disabled]) { filter: brightness(1.25); }
        .pag-btn[disabled] { opacity: 0.3; cursor: not-allowed; }
        .pag-inp { background: var(--pag-bg); color: var(--text-1); border: 1px solid var(--divider); border-radius: 4px; width: 36px; text-align: center; font-size: 0.72rem; padding: 2px 4px; }
        .pag-inp:focus { outline: none; border-color: var(--input-focus); }
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
        input[type=number] { -moz-appearance: textfield; }

        /* ── STAT CARD INTERNALS ─────────────────────────── */
        .stat-val { color: var(--text-1); font-size: 1.95rem; font-weight: 800; line-height: 1.1; }
        .stat-lbl { color: var(--text-2); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; margin: 4px 0 2px; }
        .stat-icon { font-size: 1.25rem; margin-bottom: 2px; }

        /* ── STATUS ──────────────────────────────────────── */
        #status-message { color: var(--text-3); }
    </style>
</head>

                <form onsubmit="event.preventDefault(); inicializarDashboard();" class="flex gap-2">

    <div id="filter-bar" class="filter-strip hidden">
        <div class="container mx-auto px-6 flex items-center gap-3">
            <span class="t3" style="white-space:nowrap;">Filtrar:</span>
            <div class="relative" style="max-width:280px;flex:1;">
                <input type="text" id="filter-input" placeholder="Artista, canción, álbum..." class="s-input w-full" style="padding-top:5px;padding-bottom:5px;padding-right:28px;font-size:0.8rem;">
                <button id="filter-clear" onclick="limpiarFiltro()" class="absolute right-2 top-1/2 -translate-y-1/2 hidden t3 hover:text-white" style="font-size:1.1rem;line-height:1;">×</button>
            </div>
            <span id="filter-status" class="t3"></span>
        </div>
    </div>

    <main class="container mx-auto px-6 py-6 hidden" id="dashboard">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 mb-6" id="stats-container"></div>
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">

            <div class="glass p-5 flex flex-col justify-between" style="min-height:650px;">
                <div><div class="col-title">Top Artistas</div><ul id="list-artists"></ul></div>
                <div id="pag-artists" class="flex justify-between items-center mt-4 pt-3" style="border-top:1px solid var(--divider);"></div>
            </div>

            <div class="glass p-5 flex flex-col justify-between" style="min-height:650px;">
                <div><div class="col-title">Top Álbumes</div><ul id="list-albums"></ul></div>
                <div id="pag-albums" class="flex justify-between items-center mt-4 pt-3" style="border-top:1px solid var(--divider);"></div>
            </div>

            <div class="glass p-5 flex flex-col justify-between" style="min-height:650px;">
                <div><div class="col-title">Top Canciones</div><ul id="list-tracks"></ul></div>
                <div id="pag-tracks" class="flex justify-between items-center mt-4 pt-3" style="border-top:1px solid var(--divider);"></div>
            </div>

            <div class="glass p-5 flex flex-col justify-between" style="min-height:650px;">
                <div><div class="col-title">Últimos Scrobbles</div><ul id="list-scrobbles"></ul></div>
                <div id="pag-scrobbles" class="flex justify-between items-center mt-4 pt-3" style="border-top:1px solid var(--divider);"></div>
            </div>

        </div>
    </main>

    <div id="status-message" class="text-center mt-24 text-base">
        Introduce un nombre de usuario para ver sus estadísticas procesadas.
    </div>

    <script>
        // ── THEME ────────────────────────────────────────────
        function applyTheme(dark) {
            document.documentElement.classList.toggle('dark', dark);
            document.getElementById('theme-icon').textContent  = dark ? '☀️' : '🌙';
            document.getElementById('theme-label').textContent = dark ? 'Modo claro' : 'Modo oscuro';
            localStorage.setItem('lfm-theme', dark ? 'dark' : 'light');
        }
        function toggleTheme() { applyTheme(!document.documentElement.classList.contains('dark')); }
        // Init from saved preference — light (red) is the default
        applyTheme(localStorage.getItem('lfm-theme') === 'dark');

        // ── STATE ────────────────────────────────────────────
        const API_BASE_URL = `http://${window.location.hostname}:8000/api/v1`;
        let usuarioActual = "";
        let paginas = { artists:1, albums:1, tracks:1, scrobbles:1 };
        const LIMITE = 10;
        let filtroActivo = "";
        let cacheData = { artists:[], albums:[], tracks:[], scrobbles:[] };
        let maxPC = { artists:1, albums:1, tracks:1 };

        // ── FILTER ───────────────────────────────────────────
        document.getElementById("filter-input").addEventListener("input", function() {
            filtroActivo = this.value.trim().toLowerCase();
            document.getElementById("filter-clear").classList.toggle("hidden", !filtroActivo);
            paginas = { artists:1, albums:1, tracks:1, scrobbles:1 };
            aplicarFiltro();
        });

        function limpiarFiltro() {
            filtroActivo = "";
            document.getElementById("filter-input").value = "";
            document.getElementById("filter-clear").classList.add("hidden");
            document.getElementById("filter-status").textContent = "";
            paginas = { artists:1, albums:1, tracks:1, scrobbles:1 };
            aplicarFiltro();
        }

        function filtrarDatos(tipo, datos) {
            if (!filtroActivo) return datos;
            return datos.filter(item =>
                (item.artist_name||"").toLowerCase().includes(filtroActivo) ||
                (item.track_name||"").toLowerCase().includes(filtroActivo) ||
                (item.album_name||"").toLowerCase().includes(filtroActivo)
            );
        }

        function aplicarFiltro() {
            let total = 0;
            ["artists","albums","tracks","scrobbles"].forEach(tipo => {
                const f = filtrarDatos(tipo, cacheData[tipo]);
                total += f.length;
                const s = (paginas[tipo]-1)*LIMITE;
                renderizarEntidad(tipo, f.slice(s, s+LIMITE));
                renderPag(tipo, paginas[tipo], f.length);
            });
            if (filtroActivo) {
                const q = document.getElementById("filter-input").value.trim();
                document.getElementById("filter-status").innerHTML = total > 0
                    ? `${total} resultado${total!==1?'s':''} — <strong style="color:var(--text-1)">${q}</strong>`
                    : `Sin resultados — <strong style="color:var(--text-1)">${q}</strong>`;
            } else {
                document.getElementById("filter-status").textContent = "";
            }
        }

        function cambiarPag(tipo, dir) { paginas[tipo]+=dir; aplicarFiltro(); }
        function irAPagina(tipo, val, max) { paginas[tipo]=Math.max(1,Math.min(parseInt(val)||1,max)); aplicarFiltro(); }

        function renderPag(tipo, cur, total) {
            const el = document.getElementById(`pag-${tipo}`);
            const pages = Math.ceil(total/LIMITE)||1;
            el.innerHTML = `
                <button class="pag-btn" onclick="if(${cur}>1) cambiarPag('${tipo}',-1)" ${cur<=1?'disabled':''}>‹</button>
                <div style="display:flex;align-items:center;gap:5px;color:var(--text-3);font-size:0.72rem;">
                    <input type="number" class="pag-inp" min="1" max="${pages}" value="${cur}"
                        onchange="irAPagina('${tipo}',this.value,${pages})"
                        onkeydown="if(event.key==='Enter')irAPagina('${tipo}',this.value,${pages})">
                    <span>/ ${pages}</span>
                </div>
                <button class="pag-btn" onclick="if(${cur}<${pages}) cambiarPag('${tipo}',1)" ${cur>=pages?'disabled':''}>›</button>`;
        }

        // ── DATA ─────────────────────────────────────────────
        function formatFecha(item) {
            let f = item.date_time||item.fecha_hora||item.timestamp_iso||item.fecha;
            if (!f||f==="Ahora") return "Ahora";
            return f.replace("T"," ").split("+")[0].trim();
        }

        async function inicializarDashboard() {
            const u = document.getElementById("username").value.trim();
            if (!u) return;
            usuarioActual = u;
            paginas = { artists:1, albums:1, tracks:1, scrobbles:1 };
            limpiarFiltro();
            document.getElementById("filter-bar").classList.add("hidden");
            await cargarStats();
            await Promise.all(["artists","albums","tracks","scrobbles"].map(cargarBloque));
            document.getElementById("filter-bar").classList.remove("hidden");
        }

        async function cargarStats() {
            const dash = document.getElementById("dashboard");
            const msg  = document.getElementById("status-message");
            dash.classList.add("hidden"); msg.classList.remove("hidden");
            msg.innerHTML = `<span style="color:var(--text-2);" class="animate-pulse">Cargando datos de ${usuarioActual}…</span>`;
            try {
                const res = await fetch(`${API_BASE_URL}/${usuarioActual}/stats`);
                if (!res.ok) throw new Error("Usuario no encontrado o sin datos procesados.");
                const s = await res.json();
                document.getElementById("stats-container").innerHTML =
                    stat("Artistas Únicos",  s.total_artistas,  "🎤") +
                    stat("Álbumes Únicos",   s.total_albums,    "💿") +
                    stat("Canciones Únicas", s.total_canciones, "🎵") +
                    stat("Scrobbles Totales",s.total_scrobbles, "📡");
                msg.classList.add("hidden"); dash.classList.remove("hidden");
            } catch(e) {
                msg.innerHTML = `<span style="color:var(--text-2);">✗ ${e.message}</span>`;
            }
        }

        async function cargarBloque(tipo) {
            const ep = { artists:"top-artists", albums:"top-albums", tracks:"top-tracks", scrobbles:"recent-scrobbles" };
            try {
                const r1 = await fetch(`${API_BASE_URL}/${usuarioActual}/${ep[tipo]}?page=1&limit=1`);
                const { total } = await r1.json();
                const r2 = await fetch(`${API_BASE_URL}/${usuarioActual}/${ep[tipo]}?page=1&limit=${total||9999}`);
                const { data } = await r2.json();
                cacheData[tipo] = data||[];
                if (tipo!=="scrobbles" && data?.length)
                    maxPC[tipo] = Math.max(...data.map(d=>d.playcount||0))||1;
                aplicarFiltro();
            } catch(e) { console.error(e); }
        }

        // ── RENDER ───────────────────────────────────────────
        function barra(pc, max) {
            const w = Math.max(3, Math.round((pc/max)*100));
            return `<div class="bar-bg"><div class="bar-fill" style="width:${w}%"></div></div>`;
        }

        function renderizarEntidad(tipo, lista) {
            if (tipo==="artists") renderLista("list-artists", lista, item=>`
                <div>
                    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px;">
                        <span class="t1" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;">
                            <span class="rank">${item.rank||'-'}.</span>${item.artist_name||'?'}
                        </span>
                        <span class="pill">${(item.playcount||0).toLocaleString('es-ES')} <span style="opacity:0.55;">${item.playcount_pct||0}%</span></span>
                    </div>
                    ${barra(item.playcount||0, maxPC.artists)}
                </div>`);

            if (tipo==="albums") renderLista("list-albums", lista, item=>`
                <div>
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px;">
                        <div style="min-width:0;">
                            <div class="t1" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                                <span class="rank">${item.rank||'-'}.</span>${item.album_name||'?'}
                            </div>
                            <div class="t2" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.artist_name||'?'}</div>
                        </div>
                        <span class="pill">${(item.playcount||0).toLocaleString('es-ES')}</span>
                    </div>
                    ${barra(item.playcount||0, maxPC.albums)}
                </div>`);

            if (tipo==="tracks") renderLista("list-tracks", lista, item=>`
                <div>
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px;">
                        <div style="min-width:0;">
                            <div class="t1" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                                <span class="rank">${item.rank||'-'}.</span>${item.track_name||'?'}
                            </div>
                            <div class="t2" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.artist_name||'?'}</div>
                        </div>
                        <span class="pill">${(item.playcount||0).toLocaleString('es-ES')}</span>
                    </div>
                    ${barra(item.playcount||0, maxPC.tracks)}
                </div>`);

            if (tipo==="scrobbles") renderLista("list-scrobbles", lista, item=>`
                <div class="scrobble-line">
                    <div class="t1" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                        ${item.track_name||'?'} <span class="t3" style="font-weight:400;">by</span> ${item.artist_name||'?'}
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px;gap:6px;">
                        <span class="t2" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.album_name||'Single'}</span>
                        <span class="date-badge">${formatFecha(item)}</span>
                    </div>
                </div>`);
        }

        function stat(titulo, valor, icono) {
            return `<div class="glass p-5 text-center stat-card">
                <div class="stat-icon">${icono}</div>
                <div class="stat-lbl">${titulo}</div>
                <div class="stat-val">${(valor||0).toLocaleString('es-ES')}</div>
            </div>`;
        }

        function renderLista(id, datos, tpl) {
            const el = document.getElementById(id);
            if (!datos||datos.length===0) {
                const q = document.getElementById("filter-input").value.trim();
                el.innerHTML = filtroActivo
                    ? `<li style="text-align:center;padding:24px 0;" class="t3">Sin resultados para "<strong style="color:var(--text-1)">${q}</strong>"</li>`
                    : `<li style="text-align:center;padding:24px 0;" class="t3">No hay registros.</li>`;
                return;
            }
            el.innerHTML = datos.map(item=>`<li class="row-item">${tpl(item)}</li>`).join('');
        }
    </script>
</body>
</html>
